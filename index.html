//              RENDER
// ============================================================

function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = PHASES.map((phase, pi) => {
    const isActivePhase = pi === state.currentPhase;
    const doneLessons = phase.lessons.filter(l => state.completed.has(l.id)).length;
    const allDone = doneLessons === phase.lessons.length && doneLessons > 0;
    const dotContent = allDone ? '<i data-lucide="check"></i>' : `0${pi+1}`;
    return `<div class="phase-group">
      <button class="phase-btn ${isActivePhase ? 'active' : ''} ${allDone ? 'done' : ''}" data-phase="${pi}">
        <div class="phase-dot">${dotContent}</div>
        <div class="phase-meta">
          <div class="phase-name">${phase.title}</div>
          <div class="phase-lessons">${doneLessons}/${phase.lessons.length} Lektionen</div>
        </div>
      </button>
      ${isActivePhase ? `<div class="lesson-list">
        ${phase.lessons.map((l, li) => {
          const isActive = li === state.currentLesson;
          const isDone = state.completed.has(l.id);
          return `<div class="lesson-item ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" data-lesson="${li}">
            <div class="lesson-dot"></div>${l.title}
          </div>`;
        }).join('')}
      </div>` : ''}
    </div>`;
  }).join('');

  nav.querySelectorAll('[data-phase]').forEach(btn => {
    btn.addEventListener('click', () => goToPhase(parseInt(btn.dataset.phase, 10)));
  });
  nav.querySelectorAll('[data-lesson]').forEach(item => {
    item.addEventListener('click', () => {
      state.currentLesson = parseInt(item.dataset.lesson, 10);
      state.quizAnswered.clear();
      render();
    });
  });
}

function updateProgress() {
  const total = getTotalLessons();
  const done = state.completed.size;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('global-progress').style.width = pct + '%';
  document.getElementById('progress-count').textContent = `${done} / ${total} Lektionen`;
  document.getElementById('xp-amount').textContent = state.xp;
  document.getElementById('profile-xp').textContent = state.xp + ' XP';
}

function updateNav() {
  document.getElementById('btn-prev').disabled = (state.currentPhase === 0 && state.currentLesson === 0);
  document.getElementById('btn-next').disabled = (state.currentPhase === PHASES.length-1 && state.currentLesson === PHASES[state.currentPhase].lessons.length-1);
  const lesson = getCurrentLesson();
  const doneBadge = document.getElementById('done-badge');
  doneBadge.classList.toggle('show', state.completed.has(lesson.id));
  const phase = PHASES[state.currentPhase];
  document.getElementById('breadcrumb').innerHTML = `<span>Phase ${state.currentPhase+1}</span> / <span>${phase.title}</span> / <span>${lesson.title}</span>`;
}

function updateProfileBar() {
  const p = state.activeProfile;
  const avatar = document.getElementById('profile-avatar');
  const nameEl = document.getElementById('profile-name');
  if (p) {
    avatar.textContent = p.name.charAt(0).toUpperCase();
    nameEl.textContent = p.name;
  } else {
    avatar.textContent = '?';
    nameEl.textContent = '—';
  }
}

function render() {
  buildNav();
  updateProgress();
  updateProfileBar();
  const lesson = getCurrentLesson();
  const ca = document.getElementById('content-area');
  ca.innerHTML = lesson.content();
  ca.scrollTop = 0;
  updateNav();

  // Attach quiz/exercise handlers
  ca.querySelectorAll('[data-quiz]').forEach(btn => {
    btn.addEventListener('click', () => {
      answerQuiz(btn.dataset.quiz, parseInt(btn.dataset.idx, 10), btn);
    });
  });
  ca.querySelectorAll('[data-exercise]').forEach(btn => {
    btn.addEventListener('click', () => checkExercise(btn.dataset.exercise));
  });

  lucide.createIcons();
}

// ============================================================
//              PROFILE UI
// ============================================================

function toggleProfileMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('profile-menu');
  if (menu.classList.contains('show')) { menu.classList.remove('show'); return; }
  buildProfileMenu();
  menu.classList.add('show');
}

function buildProfileMenu() {
  const menu = document.getElementById('profile-menu');
  const profiles = loadProfiles();
  const activeId = state.activeProfile ? state.activeProfile.id : null;
  menu.innerHTML = profiles.map(p => {
    const data = loadProfileData(p.id);
    return `<button class="profile-menu-item ${p.id === activeId ? 'current' : ''}" data-switch="${p.id}">
      <i data-lucide="${p.id === activeId ? 'check' : 'user'}"></i>
      <span>${escapeHtml(p.name)} · ${data.xp} XP</span>
    </button>`;
  }).join('') + `
    <div class="profile-menu-divider"></div>
    <button class="profile-menu-item" data-action="new"><i data-lucide="user-plus"></i>Neues Profil</button>
    <button class="profile-menu-item" data-action="export"><i data-lucide="download"></i>Fortschritt exportieren</button>
    <button class="profile-menu-item" data-action="import"><i data-lucide="upload"></i>Fortschritt importieren</button>
    ${profiles.length > 1 ? `<div class="profile-menu-divider"></div>
    <button class="profile-menu-item profile-menu-danger" data-action="delete"><i data-lucide="trash-2"></i>Aktuelles Profil löschen</button>` : ''}
  `;
  menu.querySelectorAll('[data-switch]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    switchProfile(b.dataset.switch);
  }));
  menu.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    handleProfileAction(b.dataset.action);
  }));
  lucide.createIcons();
}

function switchProfile(profileId) {
  persistState();
  setActiveProfile(profileId);
  loadActiveState();
  state.currentPhase = 0;
  state.currentLesson = 0;
  state.quizAnswered.clear();
  document.getElementById('profile-menu').classList.remove('show');
  render();
}

function handleProfileAction(action) {
  document.getElementById('profile-menu').classList.remove('show');
  if (action === 'new') showNewProfileModal();
  else if (action === 'export') exportProgress();
  else if (action === 'import') document.getElementById('import-input').click();
  else if (action === 'delete') showDeleteConfirm();
}

function showModal(html) {
  const modal = document.getElementById('modal-content');
  const backdrop = document.getElementById('modal-backdrop');
  modal.innerHTML = html;
  backdrop.classList.add('show');
  lucide.createIcons();
}

function hideModal() {
  document.getElementById('modal-backdrop').classList.remove('show');
}

function showNewProfileModal(isFirst = false) {
  showModal(`
    <div class="modal-title"><i data-lucide="user-plus"></i>${isFirst ? 'Willkommen bei CodePath' : 'Neues Profil'}</div>
    <div class="modal-desc">${isFirst ? 'Erstelle dein Profil um zu starten. Dein Fortschritt wird automatisch gespeichert.' : 'Jedes Profil speichert seinen eigenen Fortschritt.'}</div>
    <input type="text" class="modal-input" id="new-profile-name" placeholder="Dein Name" maxlength="30" autofocus>
    <div class="modal-actions">
      ${isFirst ? '' : '<button class="nav-btn" onclick="hideModal()">Abbrechen</button>'}
      <button class="nav-btn primary" id="create-profile-btn">Profil erstellen</button>
    </div>
  `);
  const input = document.getElementById('new-profile-name');
  const btn = document.getElementById('create-profile-btn');
  const submit = () => {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    persistState();
    const p = createProfile(name);
    setActiveProfile(p.id);
    loadActiveState();
    state.currentPhase = 0;
    state.currentLesson = 0;
    state.quizAnswered.clear();
    hideModal();
    render();
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(() => input.focus(), 50);
}

function showDeleteConfirm() {
  if (!state.activeProfile) return;
  showModal(`
    <div class="modal-title"><i data-lucide="trash-2"></i>Profil löschen?</div>
    <div class="modal-desc">Das Profil <strong>${escapeHtml(state.activeProfile.name)}</strong> und sein gesamter Fortschritt werden permanent gelöscht. Diese Aktion kann nicht rückgängig gemacht werden.</div>
    <div class="modal-actions">
      <button class="nav-btn" onclick="hideModal()">Abbrechen</button>
      <button class="nav-btn" style="background:var(--red);border-color:var(--red);color:white" id="confirm-delete-btn">Löschen</button>
    </div>
  `);
  document.getElementById('confirm-delete-btn').addEventListener('click', () => {
    deleteProfile(state.activeProfile.id);
    loadActiveState();
    state.currentPhase = 0;
    state.currentLesson = 0;
    state.quizAnswered.clear();
    hideModal();
    if (!state.activeProfile) showNewProfileModal(true);
    else render();
  });
}

function exportProgress() {
  if (!state.activeProfile) return;
  const data = {
    profile: state.activeProfile,
    completed: [...state.completed],
    xp: state.xp,
    exportedAt: new Date().toISOString(),
    version: 1
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `codepath-${state.activeProfile.name}-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importProgress(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.profile || !Array.isArray(data.completed)) throw new Error('Ungültiges Format');
      const name = data.profile.name + ' (importiert)';
      const p = createProfile(name);
      const loaded = { completed: new Set(data.completed), xp: parseInt(data.xp || 0, 10) };
      saveProfileData(p.id, loaded);
      setActiveProfile(p.id);
      loadActiveState();
      state.currentPhase = 0;
      state.currentLesson = 0;
      state.quizAnswered.clear();
      render();
      showModal(`
        <div class="modal-title"><i data-lucide="check-circle-2"></i>Import erfolgreich</div>
        <div class="modal-desc">Profil "<strong>${escapeHtml(name)}</strong>" mit ${loaded.completed.size} abgeschlossenen Lektionen und ${loaded.xp} XP wurde erstellt.</div>
        <div class="modal-actions"><button class="nav-btn primary" onclick="hideModal()">OK</button></div>
      `);
    } catch (err) {
      showModal(`
        <div class="modal-title"><i data-lucide="alert-circle"></i>Import fehlgeschlagen</div>
        <div class="modal-desc">Die Datei konnte nicht gelesen werden: ${escapeHtml(err.message)}</div>
        <div class="modal-actions"><button class="nav-btn primary" onclick="hideModal()">OK</button></div>
      `);
    }
  };
  reader.readAsText(file);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
//              BOOTSTRAP
// ============================================================

document.addEventListener('click', (e) => {
  const menu = document.getElementById('profile-menu');
  if (menu && !e.target.closest('.profile-bar')) menu.classList.remove('show');
});

document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') {
    // Don't allow closing the first-time profile modal by backdrop click
    if (state.activeProfile) hideModal();
  }
});

document.getElementById('import-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) importProgress(file);
  e.target.value = '';
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); if (!document.getElementById('btn-prev').disabled) navigate(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); if (!document.getElementById('btn-next').disabled) navigate(1); }
});

function init() {
  migrateLegacyData();
  const loaded = loadActiveState();
  lucide.createIcons();
  if (!loaded) {
    render(); // render empty state before modal
    showNewProfileModal(true);
  } else {
    render();
  }
}

init();
</script>
</body>
</html>
