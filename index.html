        id: 'l2_5', title: 'Fehlerbehandlung mit try/except',
        content: () => `
          <div class="lesson-header animate-in">
            <div class="lesson-tag">Phase 2 · Lektion 5</div>
            <h1 class="lesson-title">Fehler abfangen — try / except</h1>
            <p class="lesson-desc">Fehler passieren: Datei fehlt, Internet ist weg, User gibt Müll ein. Guter Code bricht nicht einfach ab — er reagiert sinnvoll.</p>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.05s">
            <div class="card-label">Was passiert wenn ein Fehler auftritt?</div>
            <div class="explanation">
              Wenn Python auf einen Fehler stößt, <strong>wirft es eine "Exception"</strong> — und das Programm bricht sofort ab. Du siehst einen <em>Traceback</em>: eine Liste von Funktionsaufrufen die zu dem Fehler geführt haben.
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">Beispiel — Programm crasht</span></div>
              <div class="code-pre">zahl = <span class="fn">int</span>(<span class="st">"abc"</span>)        <span class="cm"># User tippte Müll</span>

<span class="cm">Traceback (most recent call last):
  File "main.py", line 1, in &lt;module&gt;
    zahl = int("abc")
ValueError: invalid literal for int() with base 10: 'abc'
#  ↑                                                  ↑
# Fehlertyp                                  Fehler-Detail</span></div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Wie du Tracebacks liest:</strong> immer von <strong>unten nach oben</strong>. Unten steht der Fehlertyp und die Erklärung — das ist der wichtigste Teil. Darüber siehst du in welcher Datei und Zeile er passiert ist.<br><br>
              <strong>Wichtig:</strong> der Traceback ist dein Freund, nicht dein Feind. Lies ihn aufmerksam — meistens steht die Lösung schon drin.
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.08s">
            <div class="card-label">Die wichtigsten Fehlerarten</div>
            <div class="explanation">
              Python kennt dutzende eingebaute Fehler. Diese hier wirst du am häufigsten sehen:
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">python</span></div>
              <div class="code-pre"><span class="cm"># ValueError — falscher Wert für die Operation</span>
<span class="fn">int</span>(<span class="st">"abc"</span>)                  <span class="cm"># → ValueError</span>

<span class="cm"># TypeError — falscher Datentyp</span>
<span class="st">"5"</span> + <span class="num">3</span>                     <span class="cm"># → TypeError (str + int)</span>
<span class="fn">len</span>(<span class="num">42</span>)                     <span class="cm"># → TypeError (Zahl hat keine Länge)</span>

<span class="cm"># KeyError — Dictionary-Key existiert nicht</span>
person = {<span class="st">"name"</span>: <span class="st">"Anna"</span>}
person[<span class="st">"alter"</span>]              <span class="cm"># → KeyError</span>

<span class="cm"># IndexError — Listen-Index zu groß</span>
liste = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>]
liste[<span class="num">10</span>]                   <span class="cm"># → IndexError</span>

<span class="cm"># FileNotFoundError — Datei gibt's nicht</span>
<span class="fn">open</span>(<span class="st">"datei_die_nicht_existiert.txt"</span>)

<span class="cm"># ZeroDivisionError — durch 0 geteilt</span>
<span class="num">10</span> / <span class="num">0</span>                     <span class="cm"># → ZeroDivisionError</span>

<span class="cm"># AttributeError — Methode/Attribut existiert nicht</span>
<span class="st">"hi"</span>.foo()                  <span class="cm"># → AttributeError</span>

<span class="cm"># NameError — Variable nicht definiert</span>
<span class="fn">print</span>(unbekannte_variable)  <span class="cm"># → NameError</span></div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.11s">
            <div class="card-label">try / except — der Grundbau</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">python</span><button class="copy-btn" onclick="copyCode(this)"><i data-lucide="copy"></i>kopieren</button></div>
              <div class="code-pre"><span class="cm"># try:    versuch das, was schiefgehen könnte
# except: wenn was schiefgeht, mach DAS</span>

<span class="kw">try</span>:
    zahl = <span class="fn">int</span>(<span class="fn">input</span>(<span class="st">"Gib eine Zahl ein: "</span>))
    <span class="fn">print</span>(<span class="st">f"Quadrat: {zahl ** 2}"</span>)
<span class="kw">except</span> <span class="fn">ValueError</span>:
    <span class="fn">print</span>(<span class="st">"Das war keine Zahl!"</span>)

<span class="cm"># Programm läuft normal weiter — kein Crash</span>
<span class="fn">print</span>(<span class="st">"Tschüss!"</span>)</div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.14s">
            <div class="card-label">Mehrere Fehler getrennt behandeln</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">python</span></div>
              <div class="code-pre"><span class="kw">try</span>:
    zahl = <span class="fn">int</span>(<span class="fn">input</span>(<span class="st">"Zahl: "</span>))
    ergebnis = <span class="num">100</span> / zahl

<span class="kw">except</span> <span class="fn">ValueError</span>:
    <span class="fn">print</span>(<span class="st">"Das war keine gültige Zahl!"</span>)

<span class="kw">except</span> <span class="fn">ZeroDivisionError</span>:
    <span class="fn">print</span>(<span class="st">"Du kannst nicht durch 0 teilen!"</span>)

<span class="kw">except</span> <span class="fn">Exception</span> <span class="kw">as</span> e:        <span class="cm"># fängt alles andere</span>
    <span class="fn">print</span>(<span class="st">f"Unerwarteter Fehler: {e}"</span>)
    <span class="fn">print</span>(<span class="fn">type</span>(e).__name__)        <span class="cm"># welcher Typ war's?</span>

<span class="cm"># Mehrere in einem except zusammenfassen</span>
<span class="kw">try</span>:
    ...
<span class="kw">except</span> (<span class="fn">ValueError</span>, <span class="fn">TypeError</span>) <span class="kw">as</span> e:
    <span class="fn">print</span>(<span class="st">f"Eingabe-Problem: {e}"</span>)</div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Wichtig:</strong> Reihenfolge zählt — Python prüft die except-Blöcke von oben nach unten und nimmt den <em>ersten</em> der passt. Spezifische Fehler immer <strong>vor</strong> <code>Exception</code> stellen.
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.17s">
            <div class="card-label">else & finally — Vollständige Struktur</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">python</span></div>
              <div class="code-pre"><span class="kw">try</span>:
    datei = <span class="fn">open</span>(<span class="st">"daten.txt"</span>)
    inhalt = datei.read()

<span class="kw">except</span> <span class="fn">FileNotFoundError</span>:
    <span class="fn">print</span>(<span class="st">"Datei nicht gefunden"</span>)

<span class="kw">else</span>:
    <span class="cm"># Läuft NUR wenn KEIN Fehler im try-Block war</span>
    <span class="fn">print</span>(<span class="st">f"Inhalt: {inhalt}"</span>)

<span class="kw">finally</span>:
    <span class="cm"># Läuft IMMER — egal ob Fehler oder nicht
    # Perfekt zum Aufräumen (Datei schließen, Verbindung trennen)</span>
    <span class="fn">print</span>(<span class="st">"Aufräumen..."</span>)
    <span class="kw">try</span>: datei.close()
    <span class="kw">except</span>: <span class="kw">pass</span>

<span class="cm"># Reihenfolge:  try → (except wenn Fehler / else wenn nicht) → finally</span></div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.2s">
            <div class="card-label">with-Statement — automatisches Aufräumen</div>
            <div class="explanation">
              Für Dateien, Datenbankverbindungen und ähnliches gibt's eine <strong>elegantere Lösung</strong> als try/finally: das <code>with</code>-Statement schließt automatisch alles korrekt — selbst bei Fehlern.
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">python</span></div>
              <div class="code-pre"><span class="cm"># Umständlich (mit try/finally)</span>
datei = <span class="fn">open</span>(<span class="st">"daten.txt"</span>)
<span class="kw">try</span>:
    inhalt = datei.read()
<span class="kw">finally</span>:
    datei.close()

<span class="cm"># Elegant (mit with) — Datei wird AUTOMATISCH geschlossen</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"daten.txt"</span>) <span class="kw">as</span> datei:
    inhalt = datei.read()
<span class="cm"># Hier ist die Datei garantiert zu — auch wenn read() crashed</span>

<span class="cm"># Datei lesen — Standardpattern</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"notizen.txt"</span>, encoding=<span class="st">"utf-8"</span>) <span class="kw">as</span> f:
    <span class="kw">for</span> zeile <span class="kw">in</span> f:
        <span class="fn">print</span>(zeile.strip())

<span class="cm"># Datei schreiben</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"output.txt"</span>, <span class="st">"w"</span>, encoding=<span class="st">"utf-8"</span>) <span class="kw">as</span> f:
    f.write(<span class="st">"Hallo Welt\\n"</span>)</div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.23s">
            <div class="card-label">Eigene Fehler werfen — raise</div>
            <div class="explanation">
              Manchmal willst du <em>selbst</em> einen Fehler auslösen — z.B. wenn ein Argument nicht plausibel ist. Dafür gibt's <code>raise</code>.
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">python</span></div>
              <div class="code-pre"><span class="kw">def</span> <span class="fn">setze_alter</span>(alter):
    <span class="kw">if</span> <span class="kw">not</span> <span class="fn">isinstance</span>(alter, <span class="fn">int</span>):
        <span class="kw">raise</span> <span class="fn">TypeError</span>(<span class="st">"Alter muss eine Ganzzahl sein"</span>)
    <span class="kw">if</span> alter < <span class="num">0</span> <span class="kw">or</span> alter > <span class="num">150</span>:
        <span class="kw">raise</span> <span class="fn">ValueError</span>(<span class="st">f"Alter {alter} ist nicht plausibel"</span>)
    <span class="kw">return</span> alter

<span class="fn">setze_alter</span>(<span class="num">25</span>)         <span class="cm"># OK</span>
<span class="fn">setze_alter</span>(-<span class="num">5</span>)         <span class="cm"># ValueError</span>
<span class="fn">setze_alter</span>(<span class="st">"alt"</span>)      <span class="cm"># TypeError</span>

<span class="cm"># Eigene Fehlerklassen definieren</span>
<span class="kw">class</span> <span class="fn">UngueltigerLoginError</span>(<span class="fn">Exception</span>):
    <span class="kw">pass</span>

<span class="kw">def</span> <span class="fn">login</span>(user, passwort):
    <span class="kw">if</span> passwort != <span class="st">"geheim"</span>:
        <span class="kw">raise</span> <span class="fn">UngueltigerLoginError</span>(<span class="st">f"Falsches Passwort für {user}"</span>)</div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.26s">
            <div class="card-label">Best Practices — Fallen vermeiden</div>
            <div class="explanation">
              <strong>1. Fang nur das ab was du erwartest</strong><br>
              <code>except Exception:</code> ohne guten Grund versteckt Bugs. Lieber spezifisch: <code>except ValueError:</code><br><br>
              <strong>2. Niemals <code>except: pass</code> ohne Kommentar</strong><br>
              Das schluckt jeden Fehler, auch <code>KeyboardInterrupt</code> oder Tippfehler im Code. Wenn schon, dann <code>except SpezifischerError: pass  # weil ...</code><br><br>
              <strong>3. Try-Block so klein wie möglich</strong><br>
              Nur den Teil rein der wirklich fehlschlagen kann — dann weißt du was schiefging.<br><br>
              <strong>4. Fehlermeldungen sollen helfen</strong><br>
              <code>raise ValueError("Alter -5 ist negativ")</code> ist viel hilfreicher als <code>raise ValueError("ungültig")</code>.<br><br>
              <strong>5. Validiere früh</strong><br>

            </div>

            <div class="lesson-tag">Phase 3 · Lektion 1</div>
            <h1 class="lesson-title">HTML — Die Sprache des Webs</h1>
            <p class="lesson-desc">HTML ist kein echtes Programmieren — es ist eine Auszeichnungssprache. Du beschreibst damit die Struktur einer Seite. Jeder Browser versteht sie.</p>

            <div class="card-label">Was ist HTML eigentlich?</div>

  │  │   │                  │ │         │   │
  │  │   │                  │ │         │   └── schließender Tag (mit /)
  │  │   │                  │ │         └────── Inhalt
  │  │   │                  │ └──────────────── Attribut-Wert
  │  │   │                  └────────────────── = trennt Name und Wert

<span class="kw">&lt;html</span> <span class="fn">lang</span>=<span class="st">"de"</span><span class="kw">&gt;</span>            <span class="cm">&lt;!-- Wurzel-Element, Sprache --&gt;</span>

<span class="kw">&lt;head&gt;</span>

  <span class="kw">&lt;title&gt;</span>Meine Seite<span class="kw">&lt;/title&gt;</span>

<span class="kw">&lt;/head&gt;</span>

<span class="kw">&lt;body&gt;</span>

<span class="kw">&lt;/html&gt;</span></div>

<span class="kw">&lt;h1&gt;</span>Hauptüberschrift<span class="kw">&lt;/h1&gt;</span>
<span class="kw">&lt;h2&gt;</span>Unterüberschrift<span class="kw">&lt;/h2&gt;</span>
<span class="kw">&lt;h3&gt;</span>Noch eine Stufe darunter<span class="kw">&lt;/h3&gt;</span>

<span class="cm">&lt;!-- Absätze --&gt;</span>
<span class="kw">&lt;p&gt;</span>Ein Absatz Text. Browser fügen davor und

<span class="cm">&lt;!-- Inline-Formatierung --&gt;</span>
<span class="kw">&lt;strong&gt;</span>wichtig<span class="kw">&lt;/strong&gt;</span>      <span class="cm">&lt;!-- fett, semantisch wichtig --&gt;</span>
<span class="kw">&lt;em&gt;</span>betont<span class="kw">&lt;/em&gt;</span>             <span class="cm">&lt;!-- kursiv, semantisch betont --&gt;</span>

<span class="kw">&lt;code&gt;</span>print()<span class="kw">&lt;/code&gt;</span>          <span class="cm">&lt;!-- Code-Schnipsel --&gt;</span>

<span class="kw">&lt;div</span> <span class="fn">class</span>=<span class="st">"karte"</span><span class="kw">&gt;</span>
  <span class="kw">&lt;h2&gt;</span>Titel<span class="kw">&lt;/h2&gt;</span>
  <span class="kw">&lt;p&gt;</span>Inhalt<span class="kw">&lt;/p&gt;</span>
<span class="kw">&lt;/div&gt;</span>

<span class="kw">&lt;/header&gt;</span>

<span class="kw">&lt;main&gt;</span>       <span class="cm">&lt;!-- Hauptinhalt der Seite --&gt;</span>

    <span class="kw">&lt;/section&gt;</span>

          <div class="lesson-header animate-in">
            <div class="lesson-tag">Phase 3 · Lektion 2</div>
            <h1 class="lesson-title">CSS — Design & Layout</h1>
            <p class="lesson-desc">HTML ist das Skelett, CSS ist das Aussehen. Mit CSS steuerst du Farben, Schriftarten, Abstände, Layouts — alles was eine Seite schön macht.</p>

          <div class="content-card animate-in" style="animation-delay:0.05s">

<span class="kw">&lt;link</span> <span class="fn">rel</span>=<span class="st">"stylesheet"</span> <span class="fn">href</span>=<span class="st">"style.css"</span><span class="kw">&gt;</span>

<span class="cm">&lt;!-- 2. Im &lt;style&gt;-Tag im head (für kleine Tests) --&gt;</span>
<span class="kw">&lt;style&gt;</span>

<span class="kw">&lt;/style&gt;</span>

<span class="cm">&lt;!-- 3. Direkt am Element (NUR im Notfall) --&gt;</span>
<span class="kw">&lt;p</span> <span class="fn">style</span>=<span class="st">"color: red; font-size: 18px"</span><span class="kw">&gt;</span>Text<span class="kw">&lt;/p&gt;</span></div>

<span class="cm">/* Mehrere Selektoren — durch Komma getrennt */</span>

<span class="cm">/* Kommentare gehen so */</span></div>

          <div class="content-card animate-in" style="animation-delay:0.1s">

            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.13s">
            <div class="card-label">Spezifität — wer gewinnt bei Konflikten?</div>
            <div class="explanation">
              Wenn zwei Regeln auf dasselbe Element zielen, "gewinnt" die <strong>spezifischere</strong>. Faustregel von schwach zu stark:<br><br>
              <strong>Element</strong> < <strong>Klasse</strong> < <strong>ID</strong> < <strong>inline style</strong> < <strong>!important</strong>
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="fn">p</span>           { color: blue; }     <span class="cm">/* Spezifität: 1 */</span>
<span class="fn">.text</span>       { color: green; }    <span class="cm">/* Spezifität: 10 */</span>
<span class="fn">#main</span>       { color: red; }      <span class="cm">/* Spezifität: 100 */</span>
<span class="fn">p.text</span>      { color: orange; }   <span class="cm">/* Spezifität: 11 */</span>

<span class="cm">/* &lt;p class="text" id="main"&gt;...&lt;/p&gt; → wird ROT (id gewinnt) */</span>

<span class="cm">/* !important überschreibt alles — NUR im Notfall verwenden! */</span>
<span class="fn">.warnung</span> { color: red <span class="kw">!important</span>; }</div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Profi-Tipp:</strong> wenn du oft <code>!important</code> brauchst, ist dein CSS schlecht strukturiert. Lieber die Spezifität bewusst gestalten als sie zu erzwingen.
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.16s">
            <div class="card-label">Das Box-Modell — die Grundlage von Layout</div>
            <div class="explanation">
              <strong>Jedes</strong> HTML-Element ist eine Box. Diese Box hat 4 Schichten — von innen nach außen:
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">Box-Modell</span></div>
              <div class="code-pre">  ┌──────────────────────────────┐  ← margin (Außenabstand)
  │   ┌──────────────────────┐   │
  │   │  border (Rahmen)     │   │
  │   │  ┌────────────────┐  │   │
  │   │  │  padding       │  │   │
  │   │  │  ┌──────────┐  │  │   │
  │   │  │  │ Inhalt   │  │  │   │
  │   │  │  │ (content)│  │  │   │
  │   │  │  └──────────┘  │  │   │
  │   │  └────────────────┘  │   │
  │   └──────────────────────┘   │
  └──────────────────────────────┘</div>
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="fn">.box</span> {
  width: <span class="num">300px</span>;
  height: <span class="num">200px</span>;

  padding: <span class="num">20px</span>;          <span class="cm">/* Innenabstand (alle Seiten) */</span>
  padding: <span class="num">10px 20px</span>;     <span class="cm">/* oben/unten 10, links/rechts 20 */</span>
  padding-top: <span class="num">5px</span>;       <span class="cm">/* einzelne Seite */</span>

  border: <span class="num">2px</span> solid <span class="st">#ccc</span>;
  border-radius: <span class="num">8px</span>;     <span class="cm">/* abgerundete Ecken */</span>

  margin: <span class="num">16px</span>;           <span class="cm">/* Außenabstand */</span>
  margin: <span class="num">0 auto</span>;         <span class="cm">/* horizontal zentrieren */</span>
}</div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Wichtig:</strong> standardmäßig wird <code>padding</code> und <code>border</code> zur <code>width</code> ADDIERT. <code>width: 300px + padding: 20px</code> = 340px tatsächlich. Lösung — die wichtigste CSS-Zeile überhaupt:
            </div>
            <div class="code-block" style="margin-top:8px">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="fn">*</span> {
  box-sizing: <span class="st">border-box</span>;   <span class="cm">/* width INKLUDIERT padding+border */</span>
}</div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.19s">
            <div class="card-label">Farben — alle Wege</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="cm">/* Namen — gibt ~140 vordefinierte */</span>
color: <span class="st">red</span>;
color: <span class="st">cornflowerblue</span>;
color: <span class="st">tomato</span>;

<span class="cm">/* Hex — am häufigsten */</span>
color: <span class="st">#7c6af7</span>;            <span class="cm">/* RRGGBB */</span>
color: <span class="st">#7c6</span>;               <span class="cm">/* Kurzform = #77cc66 */</span>
color: <span class="st">#7c6af780</span>;          <span class="cm">/* mit Alpha (80 = 50% opak) */</span>

<span class="cm">/* RGB — direkt mit Zahlen 0-255 */</span>
color: <span class="fn">rgb</span>(<span class="num">124</span>, <span class="num">106</span>, <span class="num">247</span>);
color: <span class="fn">rgba</span>(<span class="num">124</span>, <span class="num">106</span>, <span class="num">247</span>, <span class="num">0.5</span>);   <span class="cm">/* mit Transparenz */</span>

<span class="cm">/* HSL — Farbton, Sättigung, Helligkeit (am intuitivsten) */</span>
color: <span class="fn">hsl</span>(<span class="num">250</span>, <span class="num">85%</span>, <span class="num">70%</span>);

<span class="cm">/* Spezialwerte */</span>
color: <span class="st">transparent</span>;
color: <span class="st">currentColor</span>;        <span class="cm">/* erbt von color der Eltern */</span></div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.22s">
            <div class="card-label">Größen-Einheiten — px, em, rem, %, vw/vh</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="cm">/* px — feste Pixel — am intuitivsten */</span>
font-size: <span class="num">16px</span>;
border: <span class="num">1px</span> solid black;

<span class="cm">/* % — Prozent vom Eltern-Element */</span>
width: <span class="num">50%</span>;

<span class="cm">/* em — vielfaches der ELTERN-Schriftgröße */</span>
padding: <span class="num">1.5em</span>;          <span class="cm">/* 1.5× die Schrift des Eltern */</span>

<span class="cm">/* rem — vielfaches der WURZEL-Schriftgröße (html-Tag)
   ✓ vorhersehbar, ✓ gut für Responsive — DEFAULT EMPFEHLUNG */</span>
font-size: <span class="num">1.25rem</span>;      <span class="cm">/* 20px wenn Wurzel = 16 */</span>

<span class="cm">/* vw / vh — Prozent vom Bildschirm (viewport) */</span>
height: <span class="num">100vh</span>;           <span class="cm">/* volle Bildschirmhöhe */</span>
width: <span class="num">50vw</span>;             <span class="cm">/* halbe Bildschirmbreite */</span>

<span class="cm">/* min/max */</span>
width: <span class="fn">min</span>(<span class="num">800px</span>, <span class="num">100%</span>);  <span class="cm">/* je nachdem was kleiner ist */</span>
font-size: <span class="fn">clamp</span>(<span class="num">14px</span>, <span class="num">2vw</span>, <span class="num">24px</span>);  <span class="cm">/* min, ideal, max */</span></div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Faustregel:</strong> <code>rem</code> für Schriftgrößen und Abstände, <code>px</code> für Borders, <code>%</code> oder <code>vh/vw</code> für Layout.
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.25s">
            <div class="card-label">Typografie — Schrift gestalten</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="fn">body</span> {
  font-family: <span class="st">'Inter'</span>, <span class="st">Helvetica</span>, sans-serif;
  <span class="cm">/* Browser nimmt die erste verfügbare Schrift.
     sans-serif = Fallback wenn keine geht */</span>

  font-size: <span class="num">16px</span>;
  font-weight: <span class="num">400</span>;       <span class="cm">/* 100=dünn ... 700=fett ... 900=dick */</span>
  font-style: <span class="st">italic</span>;
  line-height: <span class="num">1.6</span>;       <span class="cm">/* Zeilenabstand — ohne Einheit am besten */</span>

  text-align: <span class="st">center</span>;     <span class="cm">/* left | right | center | justify */</span>
  text-transform: <span class="st">uppercase</span>;
  text-decoration: <span class="st">underline</span>;
  letter-spacing: <span class="num">0.05em</span>;
}

<span class="cm">/* Google Fonts einbinden (im &lt;head&gt;) */</span>
<span class="cm">/* &lt;link href="https://fonts.googleapis.com/css2?family=Inter" rel="stylesheet"&gt; */</span></div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.28s">
            <div class="card-label">Hintergründe & Schatten</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="fn">.hero</span> {
  <span class="cm">/* Einfache Hintergrundfarbe */</span>
  background: <span class="st">#7c6af7</span>;

  <span class="cm">/* Hintergrundbild */</span>

  background-size: <span class="st">cover</span>;        <span class="cm">/* füllt den Bereich, evtl. abgeschnitten */</span>
  background-position: <span class="st">center</span>;

  background: <span class="fn">linear-gradient</span>(<span class="num">135deg</span>, <span class="st">#7c6af7</span>, <span class="st">#a599f9</span>);
}

<span class="fn">.karte</span> {
  <span class="cm">/* Schatten: x-offset y-offset blur ausbreitung farbe */</span>
  box-shadow: <span class="num">0 4px 12px</span> <span class="fn">rgba</span>(<span class="num">0</span>,<span class="num">0</span>,<span class="num">0</span>,<span class="num">0.1</span>);
}

<span class="fn">.text</span> {

}</div>
            </div>
          </div>

            <div class="card-label">Display & Position — wie Elemente angeordnet werden</div>
            <div class="code-block">

              <div class="code-pre"><span class="cm">/* display — Block- oder Inline-Verhalten */</span>
display: <span class="st">block</span>;          <span class="cm">/* eigene Zeile, volle Breite (div) */</span>
display: <span class="st">inline</span>;         <span class="cm">/* fließt im Text (span) */</span>
display: <span class="st">inline-block</span>;   <span class="cm">/* inline aber width/height geht */</span>
display: <span class="st">none</span>;           <span class="cm">/* komplett unsichtbar (kein Platz) */</span>
display: <span class="st">flex</span>;           <span class="cm">/* siehe Lektion 3 */</span>
display: <span class="st">grid</span>;           <span class="cm">/* siehe Lektion 3 */</span>

<span class="cm">/* Sichtbarkeit */</span>
visibility: <span class="st">hidden</span>;       <span class="cm">/* unsichtbar aber Platz bleibt */</span>
opacity: <span class="num">0.5</span>;             <span class="cm">/* 0=unsichtbar, 1=normal */</span>

<span class="cm">/* Position */</span>
position: <span class="st">static</span>;         <span class="cm">/* Default — folgt dem Fluss */</span>
position: <span class="st">relative</span>;       <span class="cm">/* + top/left verschiebt vom Fluss-Ort */</span>
position: <span class="st">absolute</span>;       <span class="cm">/* aus dem Fluss raus, relativ zum nächsten relative-Eltern */</span>
position: <span class="st">fixed</span>;          <span class="cm">/* fix am Browser-Fenster (z.B. Header) */</span>
position: <span class="st">sticky</span>;         <span class="cm">/* normal bis Scroll-Position erreicht, dann fix */</span>

top: <span class="num">0</span>; left: <span class="num">0</span>;          <span class="cm">/* Position bei relative/absolute/fixed */</span>
z-index: <span class="num">100</span>;             <span class="cm">/* Stapel-Reihenfolge (höher = vorn) */</span></div>
            </div>

}

<span class="fn">.knopf:hover</span> {

}

<span class="fn">:root</span> {

  --text: <span class="st">#222</span>;

            </div>

        id: 'l3_3', title: 'Flexbox & Grid — Layouts',
        content: () => `
          <div class="lesson-header animate-in">
            <div class="lesson-tag">Phase 3 · Lektion 3</div>
            <h1 class="lesson-title">Flexbox & Grid — Moderne Layouts</h1>
            <p class="lesson-desc">Früher war Layout ein Albtraum (Tabellen, Float, Clearfix). Heute haben wir Flexbox und Grid — mit wenig Code wunderschöne Layouts.</p>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.05s">
            <div class="card-label">Wann Flexbox, wann Grid?</div>
            <div class="explanation">
              Beide sind moderne Layout-Werkzeuge — sie ersetzen sich nicht, sie ergänzen sich.<br><br>
              <strong>Flexbox</strong> — für <strong>1D-Layouts</strong> (eine Richtung):<br>
              Navigationsleiste, Karten in einer Reihe, Header mit Logo links + Menü rechts, vertikales Zentrieren.<br><br>
              <strong>Grid</strong> — für <strong>2D-Layouts</strong> (Zeilen UND Spalten gleichzeitig):<br>
              Bildergalerien, Dashboards, ganze Seiten-Layouts (Header oben + Sidebar links + Content + Footer).<br><br>
              <strong>Faustregel:</strong> wenn du <em>nur in eine Richtung</em> arrangieren willst → Flexbox. Wenn du Spalten UND Zeilen brauchst → Grid. Du kannst sie auch <strong>kombinieren</strong>: Grid für die ganze Seite, Flexbox in einzelnen Karten.
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.07s">
            <div class="card-label">Flexbox — Grundlagen & Achsen</div>
            <div class="explanation">
              Sobald du <code>display: flex</code> auf einen Container setzt, werden alle <strong>direkten Kinder</strong> zu Flex-Items und ordnen sich nebeneinander an.
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">html + css</span></div>
              <div class="code-pre"><span class="cm">&lt;!-- HTML --&gt;</span>
<span class="kw">&lt;div</span> <span class="fn">class</span>=<span class="st">"container"</span><span class="kw">&gt;</span>
  <span class="kw">&lt;div&gt;</span>1<span class="kw">&lt;/div&gt;</span>
  <span class="kw">&lt;div&gt;</span>2<span class="kw">&lt;/div&gt;</span>
  <span class="kw">&lt;div&gt;</span>3<span class="kw">&lt;/div&gt;</span>
<span class="kw">&lt;/div&gt;</span>

<span class="cm">/* CSS */</span>
<span class="fn">.container</span> {
  display: <span class="st">flex</span>;
  gap: <span class="num">16px</span>;          <span class="cm">/* Abstand zwischen Items — modern, super */</span>
}</div>
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">Achsen verstehen</span></div>
              <div class="code-pre">       Hauptachse (main axis) →
       ┌─────────────────────────────┐  ↑
       │ ┌────┐ ┌────┐ ┌────┐ ┌────┐ │  Querachse
       │ │ 1  │ │ 2  │ │ 3  │ │ 4  │ │  (cross)
       │ └────┘ └────┘ └────┘ └────┘ │  ↓
       └─────────────────────────────┘

  justify-content → entlang der Hauptachse (horizontal)
  align-items     → entlang der Querachse (vertikal)</div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.1s">
            <div class="card-label">Flexbox — Container-Eigenschaften</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="fn">.container</span> {
  display: <span class="st">flex</span>;

  <span class="cm">/* Richtung */</span>
  flex-direction: <span class="st">row</span>;            <span class="cm">/* default: links → rechts */</span>
  flex-direction: <span class="st">column</span>;         <span class="cm">/* von oben nach unten */</span>
  flex-direction: <span class="st">row-reverse</span>;

  <span class="cm">/* HORIZONTAL anordnen (Hauptachse) */</span>
  justify-content: <span class="st">flex-start</span>;    <span class="cm">/* links (default) */</span>
  justify-content: <span class="st">center</span>;        <span class="cm">/* mitte */</span>
  justify-content: <span class="st">flex-end</span>;      <span class="cm">/* rechts */</span>
  justify-content: <span class="st">space-between</span>; <span class="cm">/* erstes ganz links, letztes ganz rechts */</span>
  justify-content: <span class="st">space-around</span>;  <span class="cm">/* gleicher Abstand um jedes Item */</span>
  justify-content: <span class="st">space-evenly</span>;  <span class="cm">/* gleiche Lücke überall */</span>

  <span class="cm">/* VERTIKAL anordnen (Querachse) */</span>
  align-items: <span class="st">stretch</span>;           <span class="cm">/* default — alle gleich hoch */</span>
  align-items: <span class="st">center</span>;            <span class="cm">/* mitte vertikal */</span>
  align-items: <span class="st">flex-start</span>;        <span class="cm">/* oben */</span>
  align-items: <span class="st">flex-end</span>;          <span class="cm">/* unten */</span>
  align-items: <span class="st">baseline</span>;          <span class="cm">/* an Schrift-Grundlinie */</span>

  <span class="cm">/* Umbruch wenn zu wenig Platz */</span>
  flex-wrap: <span class="st">nowrap</span>;              <span class="cm">/* default: alles in eine Zeile */</span>
  flex-wrap: <span class="st">wrap</span>;                <span class="cm">/* umbrechen wenn nötig */</span>

  gap: <span class="num">16px</span>;                       <span class="cm">/* Lücke zwischen Items */</span>
  gap: <span class="num">12px 24px</span>;                 <span class="cm">/* zeilen-gap spalten-gap */</span>
}</div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.13s">
            <div class="card-label">Flexbox — Item-Eigenschaften</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="cm">/* Auf den KINDERN setzen, nicht auf dem Container */</span>

<span class="fn">.item</span> {
  flex-grow: <span class="num">1</span>;            <span class="cm">/* wachsen — füllt freien Platz */</span>
  flex-shrink: <span class="num">1</span>;          <span class="cm">/* schrumpfen wenn zu wenig Platz */</span>
  flex-basis: <span class="num">200px</span>;       <span class="cm">/* Wunsch-Größe vor dem grow/shrink */</span>

  <span class="cm">/* Kurzform: flex: grow shrink basis */</span>
  flex: <span class="num">1</span>;                 <span class="cm">/* = 1 1 0 — alle gleich groß teilen */</span>
  flex: <span class="num">2</span>;                 <span class="cm">/* dieses Item 2× so groß wie die mit flex:1 */</span>
  flex: <span class="num">0 0 200px</span>;         <span class="cm">/* fixe 200px, nicht wachsen/schrumpfen */</span>

  <span class="cm">/* Einzelne Ausrichtung (überschreibt align-items) */</span>
  align-self: <span class="st">flex-end</span>;
}</div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Beispiel:</strong> 3 Buttons, der mittlere doppelt so breit:<br>
              <code>.btn1 { flex: 1 } .btn2 { flex: 2 } .btn3 { flex: 1 }</code>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.16s">
            <div class="card-label">Flexbox — Die 5 wichtigsten Patterns</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="cm">/* 1. Element ZENTRIEREN — vertikal UND horizontal */</span>
<span class="fn">.center</span> {
  display: <span class="st">flex</span>;
  justify-content: <span class="st">center</span>;
  align-items: <span class="st">center</span>;
  min-height: <span class="num">100vh</span>;
}

<span class="cm">/* 2. HEADER mit Logo links, Nav rechts */</span>
<span class="fn">.header</span> {
  display: <span class="st">flex</span>;
  justify-content: <span class="st">space-between</span>;
  align-items: <span class="st">center</span>;
}

<span class="cm">/* 3. SIDEBAR + Content (Sidebar fix, Content füllt Rest) */</span>
<span class="fn">.layout</span> { display: <span class="st">flex</span>; }
<span class="fn">.sidebar</span> { flex: <span class="num">0 0 240px</span>; }
<span class="fn">.content</span> { flex: <span class="num">1</span>; }

<span class="cm">/* 4. KARTEN-Reihe die umbricht */</span>
<span class="fn">.cards</span> {
  display: <span class="st">flex</span>;
  flex-wrap: <span class="st">wrap</span>;
  gap: <span class="num">20px</span>;
}
<span class="fn">.card</span> { flex: <span class="num">1 1 250px</span>; }   <span class="cm">/* min 250px, Rest verteilen */</span>

<span class="cm">/* 5. FOOTER unten festhalten */</span>
<span class="fn">body</span> {
  display: <span class="st">flex</span>;
  flex-direction: <span class="st">column</span>;
  min-height: <span class="num">100vh</span>;
}
<span class="fn">main</span> { flex: <span class="num">1</span>; }              <span class="cm">/* Hauptbereich nimmt Rest */</span></div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.19s">
            <div class="card-label">CSS Grid — Grundlagen</div>
            <div class="explanation">
              Mit <code>display: grid</code> definierst du ein Raster aus Zeilen und Spalten. Items legen sich automatisch in die Zellen.
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="fn">.gallery</span> {
  display: <span class="st">grid</span>;

  <span class="cm">/* Spalten definieren */</span>
  grid-template-columns: <span class="num">200px 200px 200px</span>;     <span class="cm">/* 3 fixe Spalten */</span>
  grid-template-columns: <span class="num">1fr 1fr 1fr</span>;           <span class="cm">/* 3 gleiche, füllen alles */</span>
  grid-template-columns: <span class="num">200px 1fr 1fr</span>;         <span class="cm">/* erste fix, 2 flexibel */</span>
  grid-template-columns: <span class="fn">repeat</span>(<span class="num">4</span>, <span class="num">1fr</span>);         <span class="cm">/* = 1fr 1fr 1fr 1fr */</span>

  <span class="cm">/* Zeilen-Höhen */</span>
  grid-template-rows: <span class="num">100px auto 50px</span>;           <span class="cm">/* fix, nach Inhalt, fix */</span>

  <span class="cm">/* Lücken */</span>
  gap: <span class="num">20px</span>;                                       <span class="cm">/* Zeilen + Spalten */</span>
}</div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Was ist <code>1fr</code>?</strong> "fr" = "fraction" = ein Anteil am freien Platz. Bei <code>1fr 2fr</code> bekommt die zweite Spalte doppelt so viel Platz. Wie Flexbox-flex.
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.22s">
            <div class="card-label">Grid — Auto-Layout für Galerien</div>
            <div class="explanation">
              Das wahrscheinlich nützlichste Grid-Pattern überhaupt — eine Galerie die sich automatisch anpasst:
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="fn">.gallery</span> {
  display: <span class="st">grid</span>;
  grid-template-columns: <span class="fn">repeat</span>(<span class="fn">auto-fit</span>, <span class="fn">minmax</span>(<span class="num">200px</span>, <span class="num">1fr</span>));
  gap: <span class="num">20px</span>;
}

<span class="cm">/* Was passiert hier:
   - auto-fit  = "so viele Spalten wie reinpassen"
   - minmax    = "jede Spalte mindestens 200px, höchstens 1fr"

   Auf großem Bildschirm:  6 Spalten
   Auf Tablet:             3 Spalten
   Auf Handy:              1 Spalte

   ALLES OHNE @media — Grid macht es automatisch */</span></div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.25s">
            <div class="card-label">Grid — Items über mehrere Zellen ziehen</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="fn">.grid</span> {
  display: <span class="st">grid</span>;
  grid-template-columns: <span class="fn">repeat</span>(<span class="num">4</span>, <span class="num">1fr</span>);
  gap: <span class="num">10px</span>;
}

<span class="cm">/* Item dehnt sich über 2 Spalten */</span>
<span class="fn">.gross</span> {
  grid-column: span <span class="num">2</span>;
}

<span class="cm">/* Konkrete Position: von Spalte 1 bis 3 */</span>
<span class="fn">.hero</span> {
  grid-column: <span class="num">1</span> / <span class="num">3</span>;
  grid-row: <span class="num">1</span> / <span class="num">3</span>;     <span class="cm">/* auch über 2 Zeilen */</span>
}

<span class="cm">/* Erste Spalte bis ans Ende */</span>
<span class="fn">.banner</span> {
  grid-column: <span class="num">1</span> / -<span class="num">1</span>;     <span class="cm">/* -1 = letzte Linie */</span>
}</div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.28s">
            <div class="card-label">Grid — Layout mit Bereichen (template-areas)</div>
            <div class="explanation">
              Der lesbarste Weg ein Layout zu definieren: du <em>zeichnest</em> es im CSS.
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">html + css</span></div>
              <div class="code-pre"><span class="cm">&lt;!-- HTML --&gt;</span>
<span class="kw">&lt;div</span> <span class="fn">class</span>=<span class="st">"layout"</span><span class="kw">&gt;</span>
  <span class="kw">&lt;header&gt;</span>...<span class="kw">&lt;/header&gt;</span>
  <span class="kw">&lt;nav&gt;</span>...<span class="kw">&lt;/nav&gt;</span>
  <span class="kw">&lt;main&gt;</span>...<span class="kw">&lt;/main&gt;</span>
  <span class="kw">&lt;aside&gt;</span>...<span class="kw">&lt;/aside&gt;</span>
  <span class="kw">&lt;footer&gt;</span>...<span class="kw">&lt;/footer&gt;</span>
<span class="kw">&lt;/div&gt;</span>

<span class="cm">/* CSS — das Layout sieht visuell aus wie das Ergebnis */</span>
<span class="fn">.layout</span> {
  display: <span class="st">grid</span>;
  grid-template-columns: <span class="num">200px 1fr 200px</span>;
  grid-template-rows: <span class="num">auto 1fr auto</span>;
  grid-template-areas:
    <span class="st">"header  header  header"</span>
    <span class="st">"nav     main    aside"</span>
    <span class="st">"footer  footer  footer"</span>;
  min-height: <span class="num">100vh</span>;
}

<span class="fn">header</span> { grid-area: header; }
<span class="fn">nav</span>    { grid-area: nav; }
<span class="fn">main</span>   { grid-area: main; }
<span class="fn">aside</span>  { grid-area: aside; }
<span class="fn">footer</span> { grid-area: footer; }</div>
            </div>

      {
        id: 'l3_4', title: 'Responsive Design',
        content: () => `
          <div class="lesson-header animate-in">
            <div class="lesson-tag">Phase 3 · Lektion 4</div>
            <h1 class="lesson-title">Responsive Design — Eine Seite, alle Geräte</h1>
            <p class="lesson-desc">Über 60% aller Webseiten werden auf dem Handy geöffnet. Deine Seite MUSS auf allen Bildschirmen gut aussehen — sonst verlierst du die Hälfte deiner Besucher.</p>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.05s">
            <div class="card-label">Was bedeutet "responsive"?</div>
            <div class="explanation">
              <strong>Responsive Design</strong> = eine Webseite passt sich automatisch an die Bildschirmgröße an. Auf dem Handy sieht sie anders aus als auf dem Desktop — aber sie bleibt benutzbar und schön.<br><br>
              Vor 15 Jahren war das einfach: alle hatten 1024×768px. Heute gibt es:<br>
              • Handys (320px – 480px breit)<br>
              • Tablets (768px – 1024px)<br>
              • Laptops (1280px – 1920px)<br>
              • Riesen-Monitore (über 2560px)<br>
              • Gefaltete Geräte<br>
              • Smart-TVs<br><br>
              Du kannst nicht für jedes Gerät eine eigene Seite bauen. Eine responsive Seite passt sich an alle an — mit den Werkzeugen die du hier lernst.
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.07s">
            <div class="card-label">Die wichtigste Zeile — Viewport-Meta-Tag</div>
            <div class="explanation">
              <strong>Bevor</strong> du irgendetwas anderes machst — diese Zeile MUSS in jedem HTML-head stehen:
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">html</span></div>
              <div class="code-pre"><span class="kw">&lt;meta</span> <span class="fn">name</span>=<span class="st">"viewport"</span> <span class="fn">content</span>=<span class="st">"width=device-width, initial-scale=1.0"</span><span class="kw">&gt;</span></div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Was passiert ohne diese Zeile?</strong><br>
              Das Handy denkt, deine Seite sei für Desktop gemacht und rendert sie auf 980px breit — und zoomt dann raus, bis sie ins Display passt. Ergebnis: alles winzig und unlesbar.<br><br>
              <strong>Mit der Zeile</strong> sagst du dem Handy: "Nutze die ECHTE Geräte-Breite" (z.B. 375px beim iPhone) — und die Schrift bleibt normal lesbar.<br><br>
              <code>width=device-width</code> → echte Bildschirmbreite verwenden<br>
              <code>initial-scale=1.0</code> → kein automatischer Zoom
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.1s">
            <div class="card-label">Mobile First — die richtige Denkweise</div>
            <div class="explanation">
              Es gibt zwei Strategien:<br><br>
              <strong>Desktop First</strong> — Standard-Styles für Desktop, dann mit <code>@media (max-width:...)</code> kleinere Bildschirme anpassen.<br><br>
              <strong>Mobile First</strong> — Standard-Styles für HANDY, dann mit <code>@media (min-width:...)</code> für größere Bildschirme erweitern.<br><br>
              <strong>Mobile First gewinnt:</strong><br>
              • Du denkst zuerst über das einfachste, kleinste Layout nach<br>
              • Handys sind häufiger genutzt als Desktop<br>
              • Code ist meist schlanker (kleinere Bildschirme = weniger Layout-Code)<br>
              • Performance besser auf Handys (weniger CSS zu parsen)
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.13s">
            <div class="card-label">Media Queries — Regeln für Bildschirmgrößen</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this)"><i data-lucide="copy"></i>kopieren</button></div>
              <div class="code-pre"><span class="cm">/* Mobile First: Standard ist das Handy-Layout */</span>
<span class="fn">.container</span> {
  grid-template-columns: <span class="num">1fr</span>;       <span class="cm">/* 1 Spalte für Handy */</span>
  padding: <span class="num">12px</span>;
}

<span class="cm">/* Ab 600px (Tablet): 2 Spalten */</span>
<span class="kw">@media</span> (min-width: <span class="num">600px</span>) {
  <span class="fn">.container</span> {
    grid-template-columns: <span class="num">1fr 1fr</span>;
    padding: <span class="num">24px</span>;
  }
}

<span class="cm">/* Ab 1024px (Laptop): 3 Spalten */</span>
<span class="kw">@media</span> (min-width: <span class="num">1024px</span>) {
  <span class="fn">.container</span> {
    grid-template-columns: <span class="num">1fr 1fr 1fr</span>;
  }
}

<span class="cm">/* Andere Bedingungen */</span>
<span class="kw">@media</span> (max-width: <span class="num">600px</span>) { ... }            <span class="cm">/* bis 600px */</span>
<span class="kw">@media</span> (orientation: landscape) { ... }       <span class="cm">/* Querformat */</span>
<span class="kw">@media</span> (prefers-color-scheme: dark) { ... }    <span class="cm">/* User mag Dark Mode */</span>
<span class="kw">@media</span> (prefers-reduced-motion) { ... }        <span class="cm">/* User mag wenig Animation */</span>

<span class="cm">/* Kombiniert */</span>
<span class="kw">@media</span> (min-width: <span class="num">600px</span>) and (max-width: <span class="num">1024px</span>) { ... }</div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.16s">
            <div class="card-label">Übliche Breakpoints</div>
            <div class="explanation">
              <strong>Es gibt keinen offiziellen Standard</strong> — aber diese Werte sind verbreitet und decken die meisten Geräte ab:
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">Übliche Breakpoints</span></div>
              <div class="code-pre">  bis  640px   →  Handy        (sm)
  ab  640px   →  großes Handy (md)
  ab  768px   →  Tablet       (lg)
  ab 1024px   →  Laptop       (xl)
  ab 1280px   →  Desktop      (2xl)
  ab 1536px   →  großer Desktop</div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Profi-Tipp:</strong> entscheide Breakpoints anhand des INHALTS — nicht anhand bestimmter Geräte. Wenn dein Layout bei 720px hässlich wird, setze dort einen Breakpoint. Du musst nicht den Standard-Werten folgen.
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.19s">
            <div class="card-label">Flexible Maßeinheiten — pixel sind nicht alles</div>
            <div class="explanation">
              Wenn du nur <code>px</code> benutzt, ist deine Seite NICHT responsive. Diese Einheiten passen sich automatisch an:
            </div>
            <div class="code-block" style="margin-top:10px">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="cm">/* % — Prozent vom Eltern-Element */</span>
width: <span class="num">90%</span>;                 <span class="cm">/* nimmt 90% der Eltern-Breite */</span>

<span class="cm">/* vw / vh — Prozent vom Bildschirm (viewport) */</span>
width: <span class="num">100vw</span>;               <span class="cm">/* volle Bildschirmbreite */</span>
height: <span class="num">100vh</span>;              <span class="cm">/* volle Bildschirmhöhe */</span>
font-size: <span class="num">2vw</span>;             <span class="cm">/* skaliert mit Bildschirm */</span>

<span class="cm">/* rem — vielfaches der Wurzel-Schriftgröße */</span>
font-size: <span class="num">1.25rem</span>;          <span class="cm">/* skaliert wenn User Schrift groß stellt */</span>

<span class="cm">/* clamp — min, ideal, max in einem */</span>
font-size: <span class="fn">clamp</span>(<span class="num">1rem</span>, <span class="num">2.5vw</span>, <span class="num">2rem</span>);
<span class="cm">/* mindestens 1rem, ideal 2.5vw, höchstens 2rem
   → automatisch responsive ohne @media! */</span>

<span class="cm">/* min/max-width — Container nicht zu klein/groß */</span>
<span class="fn">.content</span> {
  width: <span class="num">90%</span>;
  max-width: <span class="num">1200px</span>;        <span class="cm">/* nicht breiter als 1200 */</span>
  margin: <span class="num">0 auto</span>;           <span class="cm">/* zentriert */</span>
}</div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.22s">
            <div class="card-label">Responsive Bilder & Medien</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">css</span></div>
              <div class="code-pre"><span class="cm">/* Bilder nie breiter als ihr Container */</span>
<span class="fn">img</span> {
  max-width: <span class="num">100%</span>;
  height: auto;              <span class="cm">/* Seitenverhältnis behalten */</span>
}

<span class="cm">/* Videos auch (z.B. eingebettete YouTubes) */</span>
<span class="fn">video, iframe</span> {
  max-width: <span class="num">100%</span>;
}</div>
            </div>
            <div class="explanation" style="margin-top:12px">
              <strong>Bessere Lösung — verschiedene Bilder für verschiedene Bildschirme</strong> (spart Daten auf Handy):
            </div>
            <div class="code-block" style="margin-top:8px">
              <div class="code-block-header"><span class="code-lang">html</span></div>
              <div class="code-pre"><span class="kw">&lt;img</span>
  <span class="fn">src</span>=<span class="st">"foto-mittel.jpg"</span>
  <span class="fn">srcset</span>=<span class="st">"foto-klein.jpg 480w,
          foto-mittel.jpg 800w,
          foto-gross.jpg 1600w"</span>
  <span class="fn">sizes</span>=<span class="st">"(max-width: 600px) 100vw, 50vw"</span>
  <span class="fn">alt</span>=<span class="st">"Beschreibung"</span><span class="kw">&gt;</span>

<span class="cm">&lt;!-- Browser wählt automatisch das passende Bild
     je nach Bildschirmgröße und -dichte (Retina) --&gt;</span></div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.25s">

        content: () => `
          <div class="lesson-header animate-in">
            <div class="lesson-tag">Phase 4 · Lektion 4</div>
            <h1 class="lesson-title">Authentifizierung — wer ist wer?</h1>
            <p class="lesson-desc">Login, Logout, "nur für Premium-User" — das ist alles Authentifizierung. Heute lernst du wie moderne Apps das lösen.</p>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.05s">
            <div class="card-label">Authentifizierung vs. Autorisierung</div>
            <div class="explanation">
              <strong>Authentifizierung</strong> — <em>Wer bist du?</em><br>
              → Login mit Email + Passwort → Server prüft → Token wird ausgegeben.<br><br>
              <strong>Autorisierung</strong> — <em>Was darfst du?</em><br>
              → Nur Premium-User dürfen auf /api/premium zugreifen.
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.08s">
            <div class="card-label">JWT — JSON Web Token</div>
            <div class="explanation">
              Ein <strong>JWT</strong> ist ein signiertes Token das sagt: "Dieser Nutzer hat sich eingeloggt". Der Server stellt es beim Login aus. Der Client schickt es bei jeder Anfrage mit.
            </div>
            <div class="code-block" style="margin-top:14px">
              <div class="code-block-header"><span class="code-lang">JWT Flow</span></div>
              <div class="code-pre"><span class="cm"># 1. Login</span>
POST /api/login
  Body: { <span class="st">"email"</span>: <span class="st">"anna@x.de"</span>, <span class="st">"password"</span>: <span class="st">"geheim"</span> }

  Antwort: { <span class="st">"token"</span>: <span class="st">"eyJhbGciOiJIUzI1..."</span> }

<span class="cm"># 2. Geschützte Anfrage mit Token im Header</span>
GET /api/meine-daten
  Header: <span class="fn">Authorization</span>: <span class="st">Bearer eyJhbGciOiJIUzI1...</span>

  Antwort: { <span class="st">"name"</span>: <span class="st">"Anna"</span>, ... }

<span class="cm"># Ein JWT besteht aus 3 Teilen (durch . getrennt):
#   HEADER.PAYLOAD.SIGNATURE
# Der Server prüft die Signatur → weiß ob das Token echt ist</span></div>
            </div>
          </div>
          <div class="content-card animate-in" style="animation-delay:0.11s">
            <div class="card-label">Passwörter NIEMALS im Klartext speichern</div>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">python — bcrypt</span></div>
              <div class="code-pre"><span class="kw">import</span> bcrypt

<span class="cm"># Registrierung: Passwort hashen</span>
passwort = <span class="st">b"geheim123"</span>
hash = bcrypt.<span class="fn">hashpw</span>(passwort, bcrypt.<span class="fn">gensalt</span>())
<span class="cm"># Hash: $2b$12$abcDEF... (niemals das Original)</span>

<span class="cm"># Login: eingegebenes Passwort gegen Hash prüfen</span>
<span class="kw">if</span> bcrypt.<span class="fn">checkpw</span>(eingabe, hash):
    <span class="fn">print</span>(<span class="st">"Passwort korrekt"</span>)</div>
            </div>
